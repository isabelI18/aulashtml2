            color: #008b8b;

            padding: 16px;
            border-radius: 8px;
            border: solid 1px #663399;
            color: #8a2be2;
            margin-bottom: 16px;
            padding: 16px;
        }

        .input:hover {
            border: solid 1px purple;
        }

        input :focus {
            background-color: #00ffff;
        }

        body {
            background-color: #6495ed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
