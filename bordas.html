<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            margin-bottom: 16px;
        }
        .borda-simples{
            border: solid blue;
        }

        .borda-esquerda{
            border-left: solid 7px color blue;
        }
        .borda-arrendodada{
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <h1>exemplos de bordas</h1>

    <div class="borda-simples"></div>
    <div class="borda-esquerda"></div>
    <div class="borda-arrendodada"></div>
</body>
</html>
