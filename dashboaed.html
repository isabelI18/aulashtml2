<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bebela</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }

        .borda {
            border: solid 5px #663399
        }

        .principal {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        .menu {
            width: 20%;
            background-color: #663399;
        }

        .conteudo {
            width: 80%;
            padding: 17px;
        }

        .cards {
            width: 290px;
            padding: 48px 32px;
            background-color: #663399;
            color: white;
            border-bottom: solid 7px black;
        }

        .sessao-cards {
            display: flex;
            justify-content: space-evenly;
        }

        h1 {
            margin-bottom: 16px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
    </style>
</head>

<body>
    <div class="principal">
        <div class="menu borda"></div>
        <div class="conteudo borda">
            <div>
                <h1>OS MELHORES</h1>
            </div>
            <div class="sessao-cards">
                <div class="cards">

                    <img src="https://cdn-images.dzcdn.net/images/cover/033a271b5ec10842c287827c39244fb5/1900x1900-000000-80-0-0.jpg"
                        alt="" width="250">
                </div>
                <div class="cards">
                    <img src="https://i.scdn.co/image/ab6761610000e5eb50defaf9fc059a1efc541f4c" alt="" width="250">
                </div>
                <div class="cards">
                    <img src="https://ih1.redbubble.net/image.5978619581.7255/fposter,small,wall_texture,square_product,600x600.jpg"
                        alt="" width="250">
                </div>
            </div>
        </div>
    </div>




</body>

</html>
